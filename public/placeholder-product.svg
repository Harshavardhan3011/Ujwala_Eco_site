<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#f5f1eb"/>
  <rect x="1" y="1" width="398" height="398" fill="none" stroke="#c9b99a" stroke-width="2" stroke-dasharray="8,4"/>
  <!-- Jute bag icon -->
  <g transform="translate(200,180)">
    <!-- Bag body -->
    <rect x="-60" y="10" width="120" height="100" rx="8" fill="none" stroke="#8B6914" stroke-width="3"/>
    <!-- Bag handles -->
    <path d="M-30,10 Q-30,-20 0,-20 Q30,-20 30,10" fill="none" stroke="#8B6914" stroke-width="3"/>
    <!-- Weave pattern lines horizontal -->
    <line x1="-58" y1="30" x2="58" y2="30" stroke="#c9a040" stroke-width="1" opacity="0.5"/>
    <line x1="-58" y1="50" x2="58" y2="50" stroke="#c9a040" stroke-width="1" opacity="0.5"/>
    <line x1="-58" y1="70" x2="58" y2="70" stroke="#c9a040" stroke-width="1" opacity="0.5"/>
    <line x1="-58" y1="90" x2="58" y2="90" stroke="#c9a040" stroke-width="1" opacity="0.5"/>
    <!-- Weave pattern lines vertical -->
    <line x1="-30" y1="12" x2="-30" y2="108" stroke="#c9a040" stroke-width="1" opacity="0.5"/>
    <line x1="-10" y1="12" x2="-10" y2="108" stroke="#c9a040" stroke-width="1" opacity="0.5"/>
    <line x1="10" y1="12" x2="10" y2="108" stroke="#c9a040" stroke-width="1" opacity="0.5"/>
    <line x1="30" y1="12" x2="30" y2="108" stroke="#c9a040" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- Text -->
  <text x="200" y="320" font-family="Georgia, serif" font-size="14" fill="#7a5c00" text-anchor="middle" font-weight="600">Ujwala Eco Products</text>
  <text x="200" y="342" font-family="Arial, sans-serif" font-size="11" fill="#9e8b6a" text-anchor="middle">Image Loading...</text>
</svg>
